name: remote-scene-platform

# 首版本机开发栈。所有服务不暴露公网；Nginx 是唯一对外入口（8080）。
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-remote_scene}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-remote_scene}"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    # 本机开发：预签名分片直传需要浏览器可达的 S3 端点（仅回环，不暴露公网）
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${APP_MINIO_BUCKET:-remote-scene}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      # TiTiler 经 GDAL/vsis3 读取 MinIO 上的私有 COG
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ENDPOINT: minio:9000
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      WEB_CONCURRENCY: "2"
      # TiTiler 仍接收去前缀后的内部路径，但生成外部 URL 时必须带受控网关前缀。
      TITILER_API_ROOT_PATH: /tiles
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    image: remote-scene/api:latest
    env_file: .env
    command:
      - sh
      - -c
      - .venv/bin/alembic upgrade head && exec .venv/bin/uvicorn app.api.app:create_app --factory --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    image: remote-scene/worker:latest
    env_file: .env
    command:
      - .venv/bin/celery
      - -A
      - app.worker.celery_app:celery
      - worker
      - -Q
      - geo
      - --concurrency
      - "2"
      - --loglevel
      - INFO
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - workertmp:/data/tmp

  dispatcher:
    image: remote-scene/api:latest
    env_file: .env
    command: [".venv/bin/python", "-m", "app.dispatcher.main"]
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: remote-scene/api:latest
    env_file: .env
    command: [".venv/bin/python", "-m", "app.scheduler.main"]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  miniodata:
  rabbitmqdata:
  workertmp:
