# API 与瓦片的统一入口。
# 瓦片网关 fail-closed：/api/v1/tiles/verify 校验短期瓦片令牌，无有效令牌的 /tiles 请求一律拒绝。
upstream api_upstream {
    server api:8000;
}

upstream titiler_upstream {
    server titiler:80;
}

server {
    listen 80;

    # 指标仅供 Compose 内网中的 Prometheus 抓取，不从统一入口暴露。
    location = /api/v1/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 内部鉴权子请求：由 API 校验短期瓦片令牌（Stage 2 实现）
    location = /_tile_auth {
        internal;
        proxy_pass http://api_upstream/api/v1/tiles/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    location /tiles/ {
        auth_request /_tile_auth;
        # /tiles/{...} → TiTiler /{...}（TiTiler COG 路由为 /cog/tiles/...）
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://titiler_upstream;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
