# Prometheus 基线抓取配置：Stage 1 覆盖 API 进程；
# Worker/Dispatcher/Scheduler 指标随 Stage 6 可观测性工作补充。
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
