# Prometheus 抓取 API 暴露的 HTTP 与 Stage 6 聚合运维指标；队列和 Worker 状态
# 由 API 采集 RabbitMQ Management，Job/Outbox/存储状态从 PostgreSQL 读取。
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
